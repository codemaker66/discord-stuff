[package]
name = "dopas-purifier-setup"
version = "1.0.0"
description = "Installs Dopa's Discord Purifier (Vencord with the purifier built in) into the Discord desktop app"
authors = ["Bardo & Dopa"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "dopa_setup"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "dopas-purifier-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
